name: Sandbox wheel smoke test

# THROWAWAY. Do not merge upstream.
#
# release.yml only runs via workflow_call at release time, so a broken matrix
# row is not discovered until it blocks a release. This builds just the new
# rows (plus one known-good control) so they can be verified ahead of time.

on:
  push:
    branches: [ 'sandbox/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.os }} / ${{ matrix.target }} / ${{ matrix.manylinux }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # control: already ships today, so a failure here means the sandbox
          # itself is broken rather than the new rows.
          - { os: ubuntu-latest, target: riscv64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: ppc64le, manylinux: auto }
          - { os: ubuntu-latest, target: ppc64le, manylinux: musllinux_1_2 }
          - { os: windows-11-arm, target: aarch64, manylinux: '' }
          # same target from an x64 host: does the ARM runner actually matter?
          - { os: windows-latest, target: aarch64, manylinux: '' }
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.13'
    - name: Stamp a dummy release version into Cargo.toml
      # mirrors release.yml, including the bash shell override, so the step is
      # exercised on the new windows-11-arm runner too.
      shell: bash
      run: python tooling/scripts/write-cargo-version.py "6.165.6"
    - name: Build abi3 wheel
      uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
      with:
        target: ${{ matrix.target }}
        manylinux: ${{ matrix.manylinux }}
        args: --release --out dist --features abi3
        working-directory: hypothesis
    - name: Show what was built
      shell: bash
      run: ls -la hypothesis/dist/
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: smoke-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
        path: hypothesis/dist/*.whl
